artifacts = ["/app/maze.py"]

schema_version = "2.0"

[task]
name = "insight/maze-solver"
description = "Breadth-first shortest path and reachability over a text grid maze: find the fewest 4-directional moves from S to E (or report unreachable) and count cells reachable from S, with ragged rows and non-'.' characters treated as walls. Graded by exact JSON comparison on sample and held-out mazes, including unreachable ones."

[metadata]
difficulty_explanation = "A compact algorithmic terminal task. The agent must parse a possibly-ragged character grid (positions past a short row are walls, every non-passable glyph including spaces is a wall), run BFS from S for the shortest step count, handle the unreachable case as null rather than a sentinel, and also report the size of S's reachable component. Common failures: treating distance as cell count rather than moves, mishandling ragged rows, counting diagonals, or crashing when E is walled off."
solution_explanation = "Locate S and E, then BFS from S over passable cells ('.', 'S', 'E') in four directions, recording distances. steps is dist[E] if E was reached else null; reachable is whether E is in the visited set; reachable_cells is the number of visited cells. ~70 lines of standard-library Python (collections.deque)."
verification_explanation = "A hidden verifier runs the candidate on one sample and six held-out mazes (seed-generated at varying sizes and wall densities, deliberately including unreachable ones) and compares the emitted JSON for exact equality. The suite asserts the held-out set contains both reachable and unreachable mazes, and an anchor pins sample_1 (reachable, 8 steps). The stub reports unreachable/0 and fails (Nop = 0); the reference passes all cases (Oracle = 1)."
category = "SWE"
subcategory = "Algorithms"
tags = ["python", "bfs", "graph-search", "grid", "cli", "terminal-bench"]
expert_time_estimate_hours = 1
relevant_experience = "Graph search on grids (BFS), reachability, and careful input parsing."

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
